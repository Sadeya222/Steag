[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stegstr"
version = "0.1.0"
description = "Contest-grade image steganography with Nostr identity/sync (Tier A: DCT-QIM + Reed-Solomon; Tier B: learned encoder, planned)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "reedsolo>=1.7",
    "typer>=0.12",
    "nostr-sdk>=0.44",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "python-multipart>=0.0.9"]
mcp = ["mcp>=2.0"]
ml = ["torch>=2.2", "torchvision>=0.17", "kornia>=0.7"]
test = ["pytest>=8.0"]

[project.scripts]
stegstr = "stegstr.cli:app"

[tool.setuptools.packages.find]
include = ["stegstr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
